services:
  anonymization:
    build: ./service
    container_name: anonymization-service
    ports:
      # 8001: порт 8000 занят другим проектом (spam-lb)
      - "8001:8000"
    volumes:
      # Модели, скачанные с Hugging Face (см. README «Быстрый старт»)
      - ./models:/models:ro
      # Кэш Natasha (эмбеддинги) — чтобы не качать при каждом старте
      - natasha_cache:/tmp/natasha
    environment:
      - GLINER_MODEL_DIR=/models/gliner_ru_finetuned_v2
      # Ограничение потоков torch на CPU
      - OMP_NUM_THREADS=4
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped

volumes:
  natasha_cache:
